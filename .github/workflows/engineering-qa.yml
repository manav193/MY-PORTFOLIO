name: Engineering QA

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: engineering-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Build production site
        if: ${{ always() && steps.install.outcome == 'success' }}
        id: build
        run: npm run build

      # Keep independent diagnostics running after a failed build or QA gate.
      # These checks inspect source files and can still explain unrelated failures.
      - name: Validate semantic DOM contracts
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run qa:dom

      - name: Check internal, asset and selected external links
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run qa:links

      - name: Enforce production performance budgets
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run qa:budget

      - name: Install Playwright Chromium
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: Responsive smoke, console gate and visual captures
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run qa:engineering

      - name: Check authoritative latest-commit deployment state
        if: ${{ always() && steps.install.outcome == 'success' && github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run qa:deployment

      - name: Upload visual regression captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.sha }}
          path: test-results/visual-regression
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
