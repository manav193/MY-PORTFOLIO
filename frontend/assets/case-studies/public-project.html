<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Case Study — Manav Agarwal</title><meta name="description" content="Product and engineering case study by Manav Agarwal."><link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../css/styles.css"><link rel="stylesheet" href="../../css/project-page.css"></head><body><nav class="site-nav showroom-nav"><div class="nav-container"><a href="../../index.html#work" class="brand">← Index</a><div class="project-nav-actions" id="repo-action"></div></div></nav><main class="cs-premium-layout" id="case-study"></main><footer class="cs-footer"><a href="../../index.html#work" class="cs-back-link">Return to Portfolio</a></footer><script>
const PROJECTS={
'fate-ai':{title:'FATE-AI',subtitle:'One workspace. A configurable pool of 100+ AI APIs. Continuous routing until no eligible route remains.',repo:'https://github.com/manav193/FATE-AI',theme:'nimo',visual:'100+ API',visualDetail:'CONTINUOUS PROVIDER ROUTING',problem:'Using separate AI products fragments conversations, coding tasks, provider keys, model selection and usage tracking. A long-running task can stop when one provider reaches quota, times out or fails even when other configured routes remain available.',solution:'FATE-AI creates one orchestration layer for multiple official provider APIs and accounts. It preserves task context, automatically moves through eligible routes and still allows manual provider selection.',features:['Multiple provider and account pool','Automatic retryable failover','Manual provider switching','Shared conversation context','Health, latency, priority and usage visibility','Server-side credentials and redacted errors'],architecture:'A React and TypeScript client provides chat, comparison, provider-vault and usage views. A Node.js server validates requests and routes complete conversations through adapters for OpenAI, Groq, Gemini and Anthropic.',tech:['React','TypeScript','Node.js','Provider Adapters','Failover','Validation'],challenge:'The system must continue useful work without creating unbounded retries, hiding failures or pretending provider quotas do not exist.',outcome:'Real adapters, priority routing, retries, timeouts, routing tests and a local interactive workspace are implemented. Streaming, durable encrypted credentials, authentication and sandboxed coding execution remain roadmap items.',notice:'FATE-AI routes valid user-configured credentials under official provider quotas and policies; it does not bypass limits.'},
'flora-and-flavor':{title:'Flora & Flavor',subtitle:'Botanical dining, reimagined through cinematic motion and seasonal storytelling.',repo:'https://github.com/manav193/Flora-and-Flavor',theme:'velora',visual:'FLORA & FLAVOR',visualDetail:'ELEGANT BOTANICAL DINING',problem:'A conventional menu-first restaurant site would not communicate the sensory, premium identity of the concept. The hero also needed to feel intentional rather than visually empty.',solution:'The experience uses scroll as a storytelling control: a plated bowl rotates and scales while typography and calls to action enter sequentially, bringing the brand narrative to life.',features:['GSAP and ScrollTrigger pinned hero','Scroll-synchronised bowl motion','Staggered typography reveals','Seasonal vegetarian menu filters','Reservation feedback','Gallery, reviews and ordering interactions','Responsive navigation','Reduced-motion support'],architecture:'A dependency-light static implementation combines semantic HTML, modern CSS and Vanilla JavaScript with GSAP and ScrollTrigger for cinematic choreography.',tech:['HTML5','CSS3','Vanilla JavaScript','GSAP','ScrollTrigger','Accessibility'],challenge:'Synchronize multiple visual layers to scrolling while preserving readability, mobile performance and accessible reduced-motion behavior.',outcome:'A portfolio-ready hospitality experience demonstrating editorial design, restaurant UX and cinematic frontend choreography.',notice:'Flora & Flavor is a fictional vegetarian restaurant and portfolio concept; reservations and ordering are front-end demonstrations.'},
'multi-api-system':{title:'Multi API System',subtitle:'The provider-routing prototype that established the architecture later expanded in FATE-AI.',repo:'https://github.com/manav193/Multi_API_system',theme:'nimo',visual:'API → ROUTER → API',visualDetail:'MULTI-PROVIDER PROTOTYPE',problem:'A single AI endpoint creates a hard failure boundary. Quota, credential, latency or availability failures can stop the entire workflow.',solution:'The prototype separated client and server responsibilities, introduced provider adapters and a registry, and explored automatic and manual route selection.',features:['Provider registry','Server-side adapters','Multiple-account priority','Retryable failover','Manual provider selection','Validation and timeouts','Security middleware direction','Automated routing tests'],architecture:'Provider-specific behavior sits behind a common execution interface so routing, errors, credentials and policy are not scattered across frontend components.',tech:['TypeScript','Node.js','Provider Registry','Failover','Security Middleware','Tests'],challenge:'Standardize unlike provider APIs without leaking credentials or provider-specific errors into the browser experience.',outcome:'The repository validated the multi-provider architecture and became the foundation for the broader FATE-AI product direction.',notice:'This is the earlier prototype; FATE-AI is the expanded product workspace.'},
'resume-ai':{title:'ResumeAI',subtitle:'A modern Android resume-builder concept focused on guided writing, ATS-aware structure and document preview.',repo:'https://github.com/manav193/resume-ai',theme:'toolverse',visual:'RESUME AI',visualDetail:'KOTLIN · COMPOSE · MATERIAL 3',problem:'Job seekers often struggle to organize experience, write concise summaries, select relevant skills and maintain a professional document hierarchy.',solution:'ResumeAI proposes a guided mobile workflow that combines structured forms, controlled AI suggestions, templates, preview and local resume management.',features:['Professional resume builder','AI-assisted summaries','Skills suggestions','ATS-oriented template direction','Live preview','PDF export goal','Resume search and management','Dark mode'],architecture:'The documented Android direction uses Kotlin, Jetpack Compose, Material 3, Navigation Compose, MVVM and Room for local storage.',tech:['Kotlin','Jetpack Compose','Material 3','MVVM','Room','PDF'],challenge:'Use AI to accelerate writing without inventing claims or removing user control, while keeping templates readable by people and ATS systems.',outcome:'The product and architecture direction are documented. Final screenshots, build verification and implemented-versus-planned confirmation remain pending.',notice:'Current case-study claims are limited to documented repository information.'},
'aurora-control-ui':{title:'Aurora Control UI',subtitle:'A responsive operational dashboard for system health, priority work and high-density control workflows.',repo:'https://github.com/manav193/AURORA-CONTROL-UI',theme:'nimo',visual:'AURORA',visualDetail:'CONTROL SYSTEMS INTERFACE',problem:'Operational dashboards can become walls of equally weighted cards, making status and priority difficult to scan.',solution:'Aurora establishes hierarchy through a persistent workspace rail, system-health hero, compact metrics and an actionable priority list.',features:['Workspace navigation','System-health overview','Metric modules','Priority-work list','Responsive layout','High-contrast surfaces','Operational status language','Dependency-free implementation'],architecture:'The static prototype uses HTML, CSS Grid and Vanilla JavaScript to explore dashboard information architecture without framework overhead.',tech:['HTML','CSS Grid','Vanilla JavaScript','Responsive UI','Dashboard UX'],challenge:'Create a visually premium control surface without allowing decorative complexity to obscure operational meaning.',outcome:'A focused dashboard prototype demonstrating hierarchy, responsive systems and control-room interface design.',notice:'The repository is a portfolio reconstruction; exact Figma-layer parity is not claimed.'},
'shift-zero-ui':{title:'SHIFT-ZERO UI',subtitle:'A high-contrast HUD and premium menu language designed for split-second readability.',repo:'https://github.com/manav193/SHIFT-ZERO-UI',theme:'shift-zero',image:'../../images/sz_menu.png',problem:'Fast action games can lose critical state inside particles, movement and aggressive art direction.',solution:'The UI reserves saturated accents for warnings and active states, while neutral surfaces organize menus, metrics and command navigation.',features:['High-contrast HUD hierarchy','Premium dashboard-style menu','Command-oriented navigation','System-score visual direction','Pipeline and metric cards','Responsive static reconstruction','Critical-state accent system','Reduced visual noise'],architecture:'The visual language is explored independently from the main Godot repository so menus, HUD states and interaction patterns can be validated before production integration.',tech:['Game UI','HUD Design','HTML','CSS','Vanilla JavaScript','Godot Direction'],challenge:'Preserve a strong cyber-technical identity without obscuring gameplay-critical information.',outcome:'A reusable presentation target for the wider SHIFT-ZERO project and a standalone game-interface design case study.',notice:'This repository focuses on presentation direction; gameplay architecture lives in the main SHIFT-ZERO repository.'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
const id=new URLSearchParams(location.search).get('id');const p=PROJECTS[id];if(!p){location.replace('../../index.html#work');throw new Error('Unknown project');}document.title=`${p.title} — Case Study`;document.body.dataset.projectTheme=p.theme;document.getElementById('repo-action').innerHTML=`<a href="${esc(p.repo)}" class="btn-primary" target="_blank" rel="noopener noreferrer">GitHub Repo</a>`;const visual=p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)} project preview" class="cs-hero-img">`:`<div style="min-height:420px;display:grid;place-items:center;border-radius:24px;background:radial-gradient(circle at 20% 20%,rgba(126,87,255,.4),transparent 34%),radial-gradient(circle at 80% 70%,rgba(0,220,255,.22),transparent 38%),linear-gradient(135deg,#080a12,#171b2a);text-align:center"><div><strong style="font:700 clamp(2rem,6vw,4.5rem) 'JetBrains Mono',monospace;color:white">${esc(p.visual)}</strong><p style="color:#aab3c8;letter-spacing:.14em">${esc(p.visualDetail)}</p></div></div>`;document.getElementById('case-study').innerHTML=`<header class="cs-hero-cinematic"><div class="cs-hero-content"><h1 class="cs-hero-title reveal-text">${esc(p.title)}</h1><p class="cs-hero-subtitle reveal-text">${esc(p.subtitle)}</p></div><div class="cs-hero-visual reveal-scale">${visual}</div></header><section class="cs-editorial-section"><div class="cs-grid-layout"><div class="cs-grid-col-4"><span class="cs-section-marker">01. Problem</span><h2 class="cs-section-heading">The product challenge.</h2></div><div class="cs-grid-col-8"><p class="cs-editorial-body">${esc(p.problem)}</p></div></div></section><section class="cs-editorial-section cs-bg-alternate"><div class="cs-grid-layout"><div class="cs-grid-col-4"><span class="cs-section-marker">02. Solution</span><h2 class="cs-section-heading">The proposed system.</h2></div><div class="cs-grid-col-8"><p class="cs-editorial-body" style="margin-bottom:28px">${esc(p.solution)}</p><ul class="cs-feature-grid">${p.features.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></section><section class="cs-editorial-section"><div class="cs-grid-layout"><div class="cs-grid-col-6"><span class="cs-section-marker">03. Architecture</span><h2 class="cs-section-heading">How it is structured.</h2><p class="cs-editorial-body">${esc(p.architecture)}</p></div><div class="cs-grid-col-6"><div class="cs-tech-stack">${p.tech.map(x=>`<div class="cs-tech-tag">${esc(x)}</div>`).join('')}</div></div></div></section><section class="cs-editorial-section cs-bg-alternate"><div class="cs-split-layout"><div class="cs-split-half"><span class="cs-section-marker">04. Challenge</span><h3 class="cs-subheading">Key design constraint.</h3><p class="cs-editorial-body">${esc(p.challenge)}</p></div><div class="cs-split-half"><span class="cs-section-marker">05. Outcome</span><h3 class="cs-subheading">Current result.</h3><p class="cs-editorial-body">${esc(p.outcome)}</p></div></div></section><section class="cs-editorial-section"><div class="cs-grid-layout"><div class="cs-grid-col-12"><span class="cs-section-marker">06. Scope</span><p class="cs-editorial-lead">${esc(p.notice)}</p></div></div></section>`;
</script><script type="module" src="../../js/main.js"></script></body></html>
